# Project-wide Gradle settings.
# https://developer.android.com/studio/build

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# The Capacitor 7 template pins AGP 8.7.2, which was validated up to
# compileSdk 35. Building against 36 works; this only silences the warning so
# CI logs stay readable. If Google ever turns that warning into an error, drop
# compileSdkVersion/targetSdkVersion back to 35 in variables.gradle.
android.suppressUnsupportedCompileSdk=36

# The APK is a WebView shell around a 1.1 MB static site. Nothing here needs
# R8, Jetifier or resource shrinking, and each one is a way for the web assets
# to silently go missing.
android.enableJetifier=false
